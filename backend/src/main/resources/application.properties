# =============================================
# Transport Management System - Configuration
# =============================================

# Server port
server.port=8080

# MySQL Database Configuration
# Replace <your_username> and <your_password> with your actual MySQL credentials
spring.datasource.url=jdbc:mysql://localhost:3306/transport_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=dhiptha@2007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# update = creates tables if not exist, updates if schema changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Application name
spring.application.name=transport-management
