<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vehicles — Transport Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav id="sidebar">
  <a class="sb-brand" href="index.html">
    <i class="bi bi-truck-front-fill"></i>
    <span class="brand-name">Transport Management</span>
    <span class="brand-sub">Operations System</span>
  </a>
  <div class="sb-section">Main Menu</div>
  <a href="index.html"       class="sb-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a href="vehicles.html"    class="sb-link active"><i class="bi bi-truck"></i> Vehicles</a>
  <a href="drivers.html"     class="sb-link"><i class="bi bi-person-badge"></i> Drivers</a>
  <a href="routes.html"      class="sb-link"><i class="bi bi-map"></i> Routes</a>
  <a href="trips.html"       class="sb-link"><i class="bi bi-calendar-check"></i> Trips</a>
  <a href="maintenance.html" class="sb-link"><i class="bi bi-tools"></i> Maintenance</a>
  <div class="sb-section">Analytics</div>
  <a href="reports.html"     class="sb-link"><i class="bi bi-bar-chart-line"></i> Reports</a>
</nav>

<div id="main">
  <div id="topbar">
    <span class="topbar-title"><i class="bi bi-truck me-2 text-primary"></i>Vehicle Management</span>
    <button class="btn btn-primary btn-sm" onclick="openAddModal()">
      <i class="bi bi-plus-lg me-1"></i>Add Vehicle
    </button>
  </div>

  <div id="content">
    <!-- Filters -->
    <div class="s-card mb-3">
      <div class="s-card-head">
        <h6><i class="bi bi-funnel me-2"></i>Search & Filter</h6>
      </div>
      <div class="p-3">
        <div class="row g-2">
          <div class="col-md-5">
            <div class="search-wrap">
              <i class="bi bi-search"></i>
              <input type="text" id="searchInput" class="form-control form-control-sm"
                placeholder="Search by registration or model…" oninput="filterVehicles()">
            </div>
          </div>
          <div class="col-md-3">
            <select id="statusFilter" class="form-select form-select-sm" onchange="filterVehicles()">
              <option value="">All Statuses</option>
              <option>AVAILABLE</option><option>IN_SERVICE</option>
              <option>MAINTENANCE</option><option>INACTIVE</option>
            </select>
          </div>
          <div class="col-md-3">
            <select id="typeFilter" class="form-select form-select-sm" onchange="filterVehicles()">
              <option value="">All Types</option>
              <option>BUS</option><option>TRUCK</option><option>VAN</option><option>CAR</option>
            </select>
          </div>
          <div class="col-md-1">
            <button class="btn btn-outline-secondary btn-sm w-100" onclick="clearFilters()">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="s-card">
      <div class="s-card-head">
        <h6><i class="bi bi-list-ul me-2"></i>All Vehicles <span class="badge bg-secondary ms-1" id="vehicleCount">0</span></h6>
      </div>
      <div class="table-responsive">
        <table class="table tbl">
          <thead><tr>
            <th>#</th><th>Reg. Number</th><th>Type</th><th>Model</th>
            <th>Capacity</th><th>Fuel</th><th>Last Service</th><th>Next Service</th>
            <th>Status</th><th>Actions</th>
          </tr></thead>
          <tbody id="vehiclesTbl"><tr><td colspan="10" class="text-center py-4 text-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="vehicleModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add Vehicle</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="vehicleId">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Registration Number *</label>
            <input type="text" id="regNumber" class="form-control" placeholder="e.g. TN 01 AB 1234">
          </div>
          <div class="col-md-6">
            <label class="form-label">Vehicle Type *</label>
            <select id="vehicleType" class="form-select">
              <option value="">Select type</option>
              <option>BUS</option><option>TRUCK</option><option>VAN</option><option>CAR</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Model *</label>
            <input type="text" id="vehicleModel" class="form-control" placeholder="e.g. Tata Starbus">
          </div>
          <div class="col-md-3">
            <label class="form-label">Capacity</label>
            <input type="number" id="capacity" class="form-control" placeholder="Seats/Tons">
          </div>
          <div class="col-md-3">
            <label class="form-label">Fuel Type</label>
            <select id="fuelType" class="form-select">
              <option value="">Select</option>
              <option>DIESEL</option><option>PETROL</option><option>CNG</option><option>ELECTRIC</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Last Service Date</label>
            <input type="date" id="lastServiceDate" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Next Service Date</label>
            <input type="date" id="nextServiceDate" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Status</label>
            <select id="vehicleStatus" class="form-select">
              <option>AVAILABLE</option><option>IN_SERVICE</option>
              <option>MAINTENANCE</option><option>INACTIVE</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="saveVehicle()">
          <i class="bi bi-save me-1"></i>Save Vehicle
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/vehicles.js"></script>
</body>
</html>
