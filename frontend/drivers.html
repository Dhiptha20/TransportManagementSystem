<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drivers — Transport Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav id="sidebar">
  <a class="sb-brand" href="index.html">
    <i class="bi bi-truck-front-fill"></i>
    <span class="brand-name">Transport Management</span>
    <span class="brand-sub">Operations System</span>
  </a>
  <div class="sb-section">Main Menu</div>
  <a href="index.html"       class="sb-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a href="vehicles.html"    class="sb-link"><i class="bi bi-truck"></i> Vehicles</a>
  <a href="drivers.html"     class="sb-link active"><i class="bi bi-person-badge"></i> Drivers</a>
  <a href="routes.html"      class="sb-link"><i class="bi bi-map"></i> Routes</a>
  <a href="trips.html"       class="sb-link"><i class="bi bi-calendar-check"></i> Trips</a>
  <a href="maintenance.html" class="sb-link"><i class="bi bi-tools"></i> Maintenance</a>
  <div class="sb-section">Analytics</div>
  <a href="reports.html"     class="sb-link"><i class="bi bi-bar-chart-line"></i> Reports</a>
</nav>

<div id="main">
  <div id="topbar">
    <span class="topbar-title"><i class="bi bi-person-badge me-2 text-primary"></i>Driver Management</span>
    <button class="btn btn-primary btn-sm" onclick="openAddModal()">
      <i class="bi bi-plus-lg me-1"></i>Add Driver
    </button>
  </div>

  <div id="content">
    <!-- Filters -->
    <div class="s-card mb-3">
      <div class="s-card-head"><h6><i class="bi bi-funnel me-2"></i>Search & Filter</h6></div>
      <div class="p-3">
        <div class="row g-2">
          <div class="col-md-6">
            <div class="search-wrap">
              <i class="bi bi-search"></i>
              <input type="text" id="searchInput" class="form-control form-control-sm"
                placeholder="Search by name or license number…" oninput="filterDrivers()">
            </div>
          </div>
          <div class="col-md-4">
            <select id="statusFilter" class="form-select form-select-sm" onchange="filterDrivers()">
              <option value="">All Statuses</option>
              <option>AVAILABLE</option><option>ASSIGNED</option>
              <option>ON_LEAVE</option><option>INACTIVE</option>
            </select>
          </div>
          <div class="col-md-2">
            <button class="btn btn-outline-secondary btn-sm w-100" onclick="clearFilters()">
              <i class="bi bi-x-lg"></i> Clear
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="s-card">
      <div class="s-card-head">
        <h6><i class="bi bi-list-ul me-2"></i>All Drivers <span class="badge bg-secondary ms-1" id="driverCount">0</span></h6>
      </div>
      <div class="table-responsive">
        <table class="table tbl">
          <thead><tr>
            <th>#</th><th>Name</th><th>License No.</th><th>Phone</th>
            <th>Experience</th><th>Assigned Vehicle</th><th>Status</th><th>Actions</th>
          </tr></thead>
          <tbody id="driversTbl"><tr><td colspan="8" class="text-center py-4 text-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="driverModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add Driver</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="driverId">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name *</label>
            <input type="text" id="driverName" class="form-control" placeholder="e.g. Rajesh Kumar">
          </div>
          <div class="col-md-6">
            <label class="form-label">License Number *</label>
            <input type="text" id="licenseNumber" class="form-control" placeholder="e.g. TN-2010-0012345">
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="text" id="phone" class="form-control" placeholder="10-digit mobile number">
          </div>
          <div class="col-md-3">
            <label class="form-label">Experience (Years)</label>
            <input type="number" id="experienceYears" class="form-control" min="0">
          </div>
          <div class="col-md-3">
            <label class="form-label">Status</label>
            <select id="driverStatus" class="form-select">
              <option>AVAILABLE</option><option>ASSIGNED</option>
              <option>ON_LEAVE</option><option>INACTIVE</option>
            </select>
          </div>
          <div class="col-md-12">
            <label class="form-label">Assigned Vehicle (optional)</label>
            <select id="assignedVehicleId" class="form-select">
              <option value="">— None —</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="saveDriver()">
          <i class="bi bi-save me-1"></i>Save Driver
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/drivers.js"></script>
</body>
</html>
